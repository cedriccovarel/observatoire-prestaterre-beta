<script>
const app=document.getElementById('app');
function redraw(){app.innerHTML=NEWOSB_REQUIREMENTS.render();NEWOSB_REQUIREMENTS.afterRender();}
window.addEventListener('newosb:requirementschange',redraw);
app.addEventListener('click',e=>NEWOSB_REQUIREMENTS.handleClick(e));

function check(key,value){const el=[...document.querySelectorAll(`[data-req-filter-check="${key}"]`)].find(x=>x.value===value);if(!el)throw new Error('missing '+key+' '+value);el.checked=true;el.dispatchEvent(new Event('change',{bubbles:true}));}

 const statusChecked=[...document.querySelectorAll('[data-req-filter-check="status"]:checked')].map(x=>x.value);
 const result=document.querySelector('.req-search-result-rich');
 const dims=[...document.querySelectorAll('.req-search-dim')].map(x=>x.innerText.trim().replace(/\n+/g,' | '));
 const counts=[...document.querySelectorAll('.req-search-count b')].map(x=>x.textContent.trim());
